name: Publish Marble Challenge Web Game
on:
  workflow_dispatch:
  push:
    paths:
      - 'Marble_Challenge_V12_fixed.html'
      - 'app/src/main/assets/game.html'
      - '.github/workflows/deploy-pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare website and Android update package
        run: |
          mkdir -p site
          cp Marble_Challenge_V12_fixed.html site/index.html
          cp app/src/main/assets/game.html site/game.html
          HASH=$(sha256sum site/game.html | cut -d ' ' -f 1)
          printf '{"version":"%s","sha256":"%s"}\\n' "$GITHUB_SHA" "$HASH" > site/version.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
