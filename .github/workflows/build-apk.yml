name: Build Marble Challenge APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'
      - 'file_000000009ae081f49fdc8eefdf484eda.png'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Generate launcher icons from the original PNG
        run: |
          test -s file_000000009ae081f49fdc8eefdf484eda.png
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          convert file_000000009ae081f49fdc8eefdf484eda.png -strip -resize 48x48^ -gravity center -extent 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert file_000000009ae081f49fdc8eefdf484eda.png -strip -resize 72x72^ -gravity center -extent 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert file_000000009ae081f49fdc8eefdf484eda.png -strip -resize 96x96^ -gravity center -extent 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert file_000000009ae081f49fdc8eefdf484eda.png -strip -resize 144x144^ -gravity center -extent 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert file_000000009ae081f49fdc8eefdf484eda.png -strip -resize 192x192^ -gravity center -extent 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Install Android SDK packages
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Marble-Challenge-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
